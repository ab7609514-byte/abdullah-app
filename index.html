<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غزالة أميرتي ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: sans-serif;
  color: white;
  background: linear-gradient(135deg, #ff758c, #ff7eb3, #c850c0);
  overflow: hidden;
}
.card {
  background: #ffffff25;
  padding: 30px 22px;
  margin: 20px;
  border-radius: 25px;
  box-shadow: 0 8px 30px #0002;
}
h1 { font-size: 30px; }
p { font-size: 21px; line-height: 1.9; }
button {
  background: white;
  color: #e84393;
  border: 0;
  border-radius: 30px;
  padding: 14px 24px;
  font-size: 18px;
  font-weight: bold;
}
.heart {
  position: fixed;
  bottom: -30px;
  animation: fly 6s linear infinite;
  pointer-events: none;
}
@keyframes fly {
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="card">
  <h1>هلو ببرنامج عبدالله ❤️</h1>
  <p>أحبج يا أغلى إنسانة عندي<br>
  غزالة أميرتي 🌹</p>
  <button onclick="alert('إنتِ أحلى شي بحياتي يا غزالة 💖')">
    اضغطي هنا يا أميرتي 💗
  </button>
</div>
<script>
setInterval(() => {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = ['❤️','💗','💕','💖'][Math.floor(Math.random()*4)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (20 + Math.random()*25) + 'px';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 400);
</script>
</body>
</html>
